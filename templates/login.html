<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sign in | MedSync</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/medsync-mark.png') }}">
    <script>
        (function () {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
</head>
<body>
    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/medsync-mark.png') }}" alt="" width="48" height="48">
                    <h1 class="h4 mt-2 mb-1">Sign in to MedSync</h1>
                    <p class="text-muted small mb-0">Medicine stock and reorder tracking</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email }}" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>

                <p class="text-muted small mt-4 mb-0">
                    Test accounts are listed in the README.
                </p>
            </div>
        </div>
    </main>
</body>
</html>
